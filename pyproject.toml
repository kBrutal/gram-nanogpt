[project]
name = "gram"
version = "0.1.0"
description = "Gradient-Routed Auxiliary Modules: capability access control in small LMs"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["gram"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
